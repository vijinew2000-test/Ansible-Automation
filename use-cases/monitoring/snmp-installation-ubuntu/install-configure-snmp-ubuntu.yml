---
- name: Install and configure SNMP on Ubuntu VMs
  hosts: all
  become: true
  become_user: root
  gather_facts: false

  vars:
    # Use a writable remote temporary directory independent of the SSH home.
    ansible_remote_tmp: /tmp/.ansible-remote/tmp
    ansible_ssh_timeout: 60

    # Store the real value in Unity inventory, Ansible Vault, or a secret manager.
    snmp_community: "{{ vault_snmp_community }}"

    # Documentation-only TEST-NET addresses. Override in protected inventory.
    monitoring_servers:
      - "192.0.2.10"
      - "192.0.2.11"

  pre_tasks:
    - name: Validate required SNMP inputs
      ansible.builtin.assert:
        that:
          - (snmp_community | default('') | string | length) > 0
          - monitoring_servers | length > 0
        fail_msg: >-
          Supply vault_snmp_community securely and at least one approved
          monitoring server address.
      no_log: true

  tasks:
    - name: Update package lists and install SNMP
      ansible.builtin.apt:
        update_cache: true
        name: "snmp*"
        state: present
      environment:
        DEBIAN_FRONTEND: noninteractive
        NEEDRESTART_MODE: "l"

    - name: Comment out the default localhost listener
      ansible.builtin.replace:
        path: /etc/snmp/snmpd.conf
        regexp: '(?im)^([ \t]*agentaddress[ \t]+127\.0\.0\.1[^\r\n]*)$'
        replace: '# \1'
        backup: true

    - name: Configure SNMP listening address
      ansible.builtin.lineinfile:
        path: /etc/snmp/snmpd.conf
        line: "agentAddress udp:161,udp6:[::1]:161"
        state: present

    - name: Allow read access from monitoring servers
      ansible.builtin.lineinfile:
        path: /etc/snmp/snmpd.conf
        line: "rocommunity {{ snmp_community }} {{ item }}"
        state: present
      loop: "{{ monitoring_servers }}"
      no_log: true

    - name: Restart SNMP and enable it at boot
      ansible.builtin.systemd_service:
        name: snmpd
        state: restarted
        enabled: true

    - name: Verify SNMP service is active
      ansible.builtin.command: systemctl is-active snmpd
      register: snmp_status
      changed_when: false
      failed_when: >
        snmp_status.rc != 0 or
        (snmp_status.stdout | trim) != "active"

    - name: Display installation result
      ansible.builtin.debug:
        msg:
          - "VM: {{ inventory_hostname }}"
          - "SNMP service: {{ snmp_status.stdout | trim }}"
          - "SNMP installation and configuration completed successfully"

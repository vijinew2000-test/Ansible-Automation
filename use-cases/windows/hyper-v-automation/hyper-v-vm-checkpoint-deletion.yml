---
- name: Delete a specific Hyper-V VM checkpoint
  hosts: all
  gather_facts: false
  become: false

  vars:
    vm_name: "win-test-01"
    checkpoint_name: "Unity-20261022-165334-708"

    # Host address and credentials come from inventory / Unity
    ansible_connection: winrm
    ansible_port: 5985
    ansible_winrm_scheme: http
    ansible_winrm_transport: ntlm

  tasks:
    - name: Check Hyper-V host connectivity
      ansible.windows.win_ping:

    - name: Delete checkpoint and verify removal
      ansible.windows.win_powershell:
        error_action: stop
        parameters:
          VMName: "{{ vm_name }}"
          CheckpointName: "{{ checkpoint_name }}"
        script: |
          param(
              [string]$VMName,
              [string]$CheckpointName
          )

          $Ansible.Changed = $false

          if ([string]::IsNullOrWhiteSpace($CheckpointName)) {
              throw "Checkpoint name must not be empty."
          }

          $vms = @(Get-VM -Name $VMName -ErrorAction Stop |
              Where-Object { $_.Name -eq $VMName })

          if ($vms.Count -ne 1) {
              throw "Expected exactly one VM named '$VMName'."
          }

          $vm = $vms[0]

          $checkpoints = @(Get-VMSnapshot -VM $vm -ErrorAction Stop |
              Where-Object { $_.Name -eq $CheckpointName })

          if ($checkpoints.Count -gt 1) {
              throw "Multiple checkpoints have this name. Use a unique checkpoint name."
          }

          if ($checkpoints.Count -eq 0) {
              $Ansible.Result = @{
                  VM = $vm.Name
                  Checkpoint = $CheckpointName
                  Status = "ALREADY ABSENT"
              }
              return
          }

          $checkpoint = $checkpoints[0]

          Remove-VMSnapshot -VMSnapshot $checkpoint `
              -Confirm:$false -ErrorAction Stop

          $Ansible.Changed = $true

          $remaining = @(Get-VMSnapshot -VM $vm -ErrorAction Stop |
              Where-Object { $_.Id -eq $checkpoint.Id })

          if ($remaining.Count -gt 0) {
              throw "Checkpoint removal verification failed."
          }

          $Ansible.Result = @{
              VM = $vm.Name
              Checkpoint = $CheckpointName
              Status = "DELETED"
          }
      register: checkpoint_result

    - name: Display checkpoint deletion details
      ansible.builtin.debug:
        msg:
          - "Hyper-V Host : {{ inventory_hostname }}"
          - "VM           : {{ checkpoint_result.result.VM }}"
          - "Checkpoint   : {{ checkpoint_result.result.Checkpoint }}"
          - "Status       : {{ checkpoint_result.result.Status }}"

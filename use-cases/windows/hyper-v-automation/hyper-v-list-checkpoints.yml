---
- name: List checkpoints for a Hyper-V VM
  hosts: localhost
  gather_facts: false
  become: false

  vars:
    # Documentation-only example address. Replace at runtime.
    hyperv_host: "192.0.2.10"
    hyperv_user: "YOUR_HOST_USERNAME"
    hyperv_password: "YOUR_HOST_PASSWORD"

    # Exact target VM name as displayed by Get-VM.
    vm_name: "win-test-01"

    # WinRM connection to the Hyper-V host.
    ansible_connection: winrm
    ansible_host: "{{ hyperv_host }}"
    ansible_user: "{{ hyperv_user }}"
    ansible_password: "{{ hyperv_password }}"
    ansible_port: 5985
    ansible_winrm_scheme: http
    ansible_winrm_transport: ntlm

  tasks:
    - name: Check Hyper-V host connectivity
      ansible.windows.win_ping:
      delegate_to: "{{ hyperv_host }}"

    - name: Fetch VM checkpoints
      ansible.windows.win_powershell:
        error_action: stop
        depth: 4
        parameters:
          VMName: "{{ vm_name }}"
        script: |
          param(
              [string]$VMName
          )

          $Ansible.Changed = $false

          $vms = @(Get-VM -Name $VMName -ErrorAction Stop |
              Where-Object { $_.Name -eq $VMName })

          if ($vms.Count -ne 1) {
              throw "Expected exactly one VM named '$VMName'."
          }

          $vm = $vms[0]

          $checkpoints = @(Get-VMSnapshot -VM $vm -ErrorAction Stop |
              Sort-Object CreationTime -Descending |
              ForEach-Object {
                  @{
                      Name = $_.Name
                      ID = $_.Id.ToString()
                      CreatedAt = $_.CreationTime.ToString("yyyy-MM-dd HH:mm:ss")
                  }
              })

          $Ansible.Result = @{
              VM = $vm.Name
              Count = $checkpoints.Count
              Checkpoints = $checkpoints
          }
      delegate_to: "{{ hyperv_host }}"
      register: checkpoint_list

    - name: Display checkpoint summary
      ansible.builtin.debug:
        msg:
          - "Hyper-V Host : {{ hyperv_host }}"
          - "VM           : {{ checkpoint_list.result.VM }}"
          - "Checkpoints  : {{ checkpoint_list.result.Count }}"
          - "Creation times use the Hyper-V host's local time."

    - name: Display each checkpoint
      ansible.builtin.debug:
        msg:
          - "Checkpoint : {{ item.Name }}"
          - "Created At : {{ item.CreatedAt }}"
          - "ID         : {{ item.ID }}"
      loop: "{{ checkpoint_list.result.Checkpoints }}"
      loop_control:
        label: "{{ item.Name }}"

    - name: Report when no checkpoints exist
      ansible.builtin.debug:
        msg: "No checkpoints found for VM '{{ vm_name }}'."
      when: checkpoint_list.result.Count | int == 0

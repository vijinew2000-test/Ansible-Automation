---
- name: Create checkpoint for test Hyper-V VM
  hosts: all
  gather_facts: false
  become: false

  vars:
    # Target VM on the selected Hyper-V host
    vm_name: "win-test-01"

    # Credentials and host address come from inventory / Unity
    ansible_connection: winrm
    ansible_port: 5985
    ansible_winrm_scheme: http
    ansible_winrm_transport: ntlm

  tasks:
    - name: Create timestamped VM checkpoint
      ansible.windows.win_powershell:
        error_action: stop
        parameters:
          VMName: "{{ vm_name }}"
        script: |
          param(
              [string]$VMName
          )

          $Ansible.Changed = $false

          if ([string]::IsNullOrWhiteSpace($VMName)) {
              throw "VM name must not be empty."
          }

          $vms = @(Get-VM -Name $VMName -ErrorAction Stop |
              Where-Object { $_.Name -eq $VMName })

          if ($vms.Count -ne 1) {
              throw "Expected exactly one VM named '$VMName'."
          }

          $vm = $vms[0]
          $checkpointName = "Unity-$(Get-Date -Format 'yyyyMMdd-HHmmss-fff')"

          $checkpoint = Checkpoint-VM -VM $vm `
              -SnapshotName $checkpointName `
              -Passthru -ErrorAction Stop

          $Ansible.Changed = $true

          $verified = @(Get-VMSnapshot -VM $vm -ErrorAction Stop |
              Where-Object { $_.Id -eq $checkpoint.Id })

          if ($verified.Count -ne 1) {
              throw "Checkpoint verification failed for VM '$VMName'."
          }

          $Ansible.Result = @{
              VM = $vm.Name
              Checkpoint = $verified[0].Name
              ID = $verified[0].Id.ToString()
              CreatedAt = $verified[0].CreationTime.ToString("yyyy-MM-dd HH:mm:ss")
              Status = "SUCCESS"
          }
      register: checkpoint_result

    - name: Display checkpoint details
      ansible.builtin.debug:
        msg:
          - "Hyper-V Host : {{ inventory_hostname }}"
          - "VM           : {{ checkpoint_result.result.VM }}"
          - "Checkpoint   : {{ checkpoint_result.result.Checkpoint }}"
          - "ID           : {{ checkpoint_result.result.ID }}"
          - "Created At   : {{ checkpoint_result.result.CreatedAt }}"
          - "Status       : {{ checkpoint_result.result.Status }}"
